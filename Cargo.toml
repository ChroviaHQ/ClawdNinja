[workspace]
resolver = "3"
members = ["crates/clawdninja-core", "src-tauri"]

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/ChroviaHQ/clawdninja"
rust-version = "1.89"

[workspace.dependencies]
clawdninja-core = { path = "crates/clawdninja-core" }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.54", features = ["time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
