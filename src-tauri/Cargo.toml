[package]
name = "clawdninja"
description = "Desktop app for macOS and Windows that launches Claude Desktop, Claude Science, ChatGPT, Visual Studio Code, and Claude Code through the network egress you choose."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "clawdninja_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
clawdninja-core.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
sys-locale = "0.3"
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.12"
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo"] }
